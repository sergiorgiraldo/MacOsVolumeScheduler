<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Speaker body -->
  <path d="M 20 35 L 35 35 L 50 20 L 50 80 L 35 65 L 20 65 Z" 
        fill="white" 
        stroke="white" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- Clock circle -->
  <circle cx="72" cy="50" r="18" 
          fill="none" 
          stroke="white" 
          stroke-width="2.5"/>
  
  <!-- Clock hour hand -->
  <line x1="72" y1="50" x2="72" y2="42" 
        stroke="white" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
  
  <!-- Clock minute hand -->
  <line x1="72" y1="50" x2="78" y2="50" 
        stroke="white" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
</svg>