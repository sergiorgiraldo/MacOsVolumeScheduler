<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button.secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        button.secondary:hover {
            background: #e0e0e0;
        }
        
        .schedule-grid {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th {
            background: #f8f9fa;
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            color: #495057;
            border: 1px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            border: 1px solid #dee2e6;
            padding: 0;
            text-align: center;
            position: relative;
        }
        
        .hour-label {
            background: #f8f9fa;
            font-weight: 500;
            padding: 8px;
            position: sticky;
            left: 0;
            z-index: 5;
        }
        
        .volume-cell {
            height: 60px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .volume-cell:hover {
            box-shadow: inset 0 0 0 2px #667eea;
        }
        
        .volume-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #667eea, #764ba2);
            transition: height 0.3s;
            opacity: 0.8;
        }
        
        .volume-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 600;
            font-size: 12px;
            color: #333;
            z-index: 2;
        }
        
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Volume Scheduler</h1>
        <p class="subtitle">Click on any cell to adjust the volume for that hour</p>
        
        <div class="controls">
            <button onclick="saveSchedule()">💾 Save Changes</button>
            <button onclick="showBulkEdit()" class="secondary">✏️ Bulk Edit</button>
            <button onclick="copyDay()" class="secondary">📋 Copy Day</button>
            <button onclick="resetSchedule()" class="secondary">🔄 Reset to Defaults</button>
        </div>
        
        <div class="schedule-grid">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>Hour</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                        <th>Sun</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                </tbody>
            </table>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <div id="bulkEditModal" class="modal">
        <div class="modal-content">
            <h2>Bulk Edit</h2>
            <div class="form-group">
                <label>Select Day:</label>
                <select id="bulkDay">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div class="form-group">
                <label>Volume Level (0-100):</label>
                <input type="number" id="bulkVolume" min="0" max="100" value="70">
            </div>
            <div class="modal-buttons">
                <button onclick="applyBulkEdit()">Apply</button>
                <button onclick="closeBulkEdit()" class="secondary">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="copyDayModal" class="modal">
        <div class="modal-content">
            <h2>Copy Day Schedule</h2>
            <div class="form-group">
                <label>Copy From:</label>
                <select id="copyFrom">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div class="form-group">
                <label>Copy To:</label>
                <select id="copyTo">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button onclick="applyCopyDay()">Copy</button>
                <button onclick="closeCopyDay()" class="secondary">Cancel</button>
            </div>
        </div>
    </div>
    
    <script>
        let schedule = {};
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        
        async function loadSchedule() {
            const response = await fetch('/api/schedule');
            schedule = await response.json();
            renderSchedule();
        }
        
        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            
            for (let hour = 0; hour < 24; hour++) {
                const row = document.createElement('tr');
                
                const hourCell = document.createElement('td');
                hourCell.className = 'hour-label';
                hourCell.textContent = `${hour.toString().padStart(2, '0')}:00`;
                row.appendChild(hourCell);
                
                days.forEach(day => {
                    const cell = document.createElement('td');
                    const volume = schedule[day][hour.toString()];
                    
                    cell.innerHTML = `
                        <div class="volume-cell" onclick="editCell('${day}', ${hour})">
                            <div class="volume-bar" style="height: ${volume}%"></div>
                            <div class="volume-label">${volume}%</div>
                        </div>
                    `;
                    
                    row.appendChild(cell);
                });
                
                tbody.appendChild(row);
            }
        }
        
        function editCell(day, hour) {
            const currentVolume = schedule[day][hour.toString()];
            const newVolume = prompt(`Set volume for ${day} at ${hour}:00\n(0-100)`, currentVolume);
            
            if (newVolume !== null) {
                const vol = Math.max(0, Math.min(100, parseInt(newVolume) || 0));
                schedule[day][hour.toString()] = vol;
                renderSchedule();
            }
        }
        
        async function saveSchedule() {
            try {
                const response = await fetch('/api/schedule', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(schedule)
                });
                
                if (response.ok) {
                    showStatus('Schedule saved successfully! ✓');
                }
            } catch (error) {
                showStatus('Error saving schedule: ' + error.message);
            }
        }
        
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        }
        
        function showBulkEdit() {
            document.getElementById('bulkEditModal').classList.add('active');
        }
        
        function closeBulkEdit() {
            document.getElementById('bulkEditModal').classList.remove('active');
        }
        
        function applyBulkEdit() {
            const day = document.getElementById('bulkDay').value;
            const volume = parseInt(document.getElementById('bulkVolume').value);
            
            for (let hour = 0; hour < 24; hour++) {
                schedule[day][hour.toString()] = volume;
            }
            
            renderSchedule();
            closeBulkEdit();
            showStatus(`Set all hours for ${day} to ${volume}%`);
        }
        
        function copyDay() {
            document.getElementById('copyDayModal').classList.add('active');
        }
        
        function closeCopyDay() {
            document.getElementById('copyDayModal').classList.remove('active');
        }
        
        function applyCopyDay() {
            const fromDay = document.getElementById('copyFrom').value;
            const toDay = document.getElementById('copyTo').value;
            
            schedule[toDay] = {...schedule[fromDay]};
            renderSchedule();
            closeCopyDay();
            showStatus(`Copied schedule from ${fromDay} to ${toDay}`);
        }
        
        function resetSchedule() {
            if (confirm('Reset schedule to defaults? This will set 30% volume for night hours (22:00-06:00) and 70% for day hours.')) {
                days.forEach(day => {
                    for (let hour = 0; hour < 24; hour++) {
                        if (hour >= 22 || hour < 6) {
                            schedule[day][hour.toString()] = 30;
                        } else {
                            schedule[day][hour.toString()] = 70;
                        }
                    }
                });
                renderSchedule();
                showStatus('Schedule reset to defaults');
            }
        }
        
        // Load schedule on page load
        loadSchedule();
    </script>
</body>
</html>
